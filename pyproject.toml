[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geopatra"
version = "1.0.0"
description = "A chatbot that speaks its answers and animates an avatar in time with its own voice"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Benjamin Becht" },
    { name = "R. Hildermann", email = "r.hildermann@outlook.de" },
]
dependencies = [
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "pyttsx3>=2.90",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]

[project.scripts]
geopatra = "geopatra.app:main"

[project.urls]
Homepage = "https://github.com/R-u-d/geopatra"
Original = "https://github.com/jobben-2025/Speak2Me"

[tool.setuptools.packages.find]
where = ["src"]

# The avatar clips are 19 MB and are read from the repository, not from the
# installed package. Install in editable mode, or run from a clone.
